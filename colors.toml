mode = "dark"

# 0xPrivacy — phosphor mainframe. 80s hacker green aesthetic: phosphor dominates,
# trust blue is gone from the theme chrome.
# Palette from src/assets/privacy-tokens.json v1.5 (dark mode), with the accent
# shifted from trust blue #4edada back to phosphor #39ff14 per design direction.
#
# Token mapping (base + semantic values are token-exact):
#   accent #39ff14 (was #4edada — shifted to phosphor for 80s hacker green)
#   accentHover #7cff7c / accentActive #a0ecec
#   phosphor #39ff14 / phosphorDim #00ff41 / phosphorMuted #7cff7c
#   foreground #c8ffc8 / foregroundMuted #7cff7c / foregroundSubtle #5aff5a
#   background #050805 / backgroundElevated #0c140c / backgroundHover #0a1a0a
#   border #1a4a1a / borderFocus #39ff14
#   error #ff5555 / warning #ffff99 / success #39ff14
#
# The ANSI ladder mirrors those token families, and every named key holds the
# same value as its colorN twin. That matters for the statusline:
# lucas.system-pulse resolves each metric ink by name with the colorN slot as
# fallback (cpu green/color2, memory magenta/color5, gpu blue/color4, heat
# yellow/color3, disk cyan/color6), so the two paths must agree.
#
# The five metric inks are hue-separated on purpose: phosphor / phosphorMuted /
# blue / warning / accentActive. Upstream's color4 was #0a3d27, a near-black
# surface tone that made the GPU reading 1.71:1 against the bar — invisible.
# The GPU uses phosphorDim #00ff41 — a medium green, distinct from CPU (bright)
# and MEM (light) by lightness. Fully monochromatic green for the 80s hacker look.

