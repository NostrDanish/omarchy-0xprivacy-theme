mode = "dark"

# 0xPrivacy — 80s hacker phosphor. Monochrome green CRT: one green hue at
# several brightness tiers, amber for heat, red for alarms. The trust blue
# accent is gone from the theme entirely.
# Palette from src/assets/privacy-tokens.json v1.5 (dark mode), with the accent
# and the cyan slots shifted onto the phosphor family per design direction.
#
# Token mapping (base + semantic values are token-exact unless noted):
#   accent #39ff14 (was #4edada — shifted to phosphor for 80s hacker green)
#   accentHover #7cff7c / accentActive #c8ffc8
#   phosphor #39ff14 / phosphorDim #00ff41 / phosphorMuted #7cff7c
#   foreground #e8ffe8 / foregroundMuted #7cff7c / foregroundSubtle #5aff5a
#   background #050805 / backgroundElevated #0c140c / backgroundHover #0a1a0a
#   border #1a4a1a / borderFocus #39ff14
#   error #ff5555 / warning #ff9f00 (amber, not the token's #ffff99) / success #39ff14
#
# The ANSI ladder mirrors those token families, and every named key holds the
# same value as its colorN twin. That matters for the statusline:
# lucas.system-pulse resolves each metric ink by name with the colorN slot as
# fallback (cpu green/color2, memory magenta/color5, gpu blue/color4, heat
# yellow/color3, disk cyan/color6), so the two paths must agree.
#
# METRIC INKS — a brightness ramp, the way a mono-green CRT separated data.
# A green screen has one hue at several intensities, so the ramp steps
# lightness instead of hue:
#   cpu    #39ff14  phosphor hero  14.84:1 on the bar
#   memory #7cff7c  light tier    15.77:1
#   gpu    #c8ffc8  pale tier     17.82:1
#   heat   #ff9f00  amber          9.79:1
#   disk   #2f9a2f  dim tier       5.54:1
# Adjacent readings in bar order are at least 36 dE apart, so one metric never
# reads as the next. A real green screen had one hue at a few intensities, and
# a four-way hue split simply is not resolvable at caption size. Upstream's
# color4 was #0a3d27, a near-black surface tone that made the GPU reading
# 1.71:1 against the bar — invisible.
#
# Amber for heat is not a modern choice: dual-phosphor terminals of the era
# ran green for data and amber for status and warnings.

